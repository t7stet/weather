<style>
  :root {
    --primary: #1976D2;
    --primary-dark: #1565C0;
    --accent: #1976D2;
    --surface: #FFFFFF;
    --bg: #F5F5F5;
    --text: #212121;
    --text-2: #616161;
    --border: #9e9e9e;
    --divider: #eeeeee;
    --hover: rgba(25,118,210,.08);
    --error: #D32F2F;
    --error-bg: #FDECEA;
    --shadow: 0 2px 2px rgba(0,0,0,.14), 0 3px 1px -2px rgba(0,0,0,.12), 0 1px 5px rgba(0,0,0,.2);
  }
  body.dark-theme {
    --accent: #64B5F6;
    --surface: #1E1E1E;
    --bg: #121212;
    --text: #EEEEEE;
    --text-2: #B0B0B0;
    --border: #757575;
    --divider: #333333;
    --hover: rgba(100,181,246,.12);
    --error: #EF9A9A;
    --error-bg: #3B2020;
    --shadow: 0 2px 2px rgba(0,0,0,.5), 0 3px 1px -2px rgba(0,0,0,.5), 0 1px 5px rgba(0,0,0,.6);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Roboto', Arial, sans-serif; line-height: 1.4; transition: background .3s, color .3s; }
  .container { max-width: 960px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px 16px; }
  .top { display: flex; align-items: center; justify-content: space-between; margin: 8px 0 16px; }
  h1 { font-size: 24px; font-weight: 500; margin: 0; display: flex; align-items: center; gap: 8px; }
  h1 .material-icons { color: var(--accent); }
  .card { background: var(--surface); border-radius: 4px; box-shadow: var(--shadow); padding: 16px; transition: background .3s; }
  .card h2, .section-title { margin: 0 0 12px; font-size: 18px; font-weight: 500; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 16px; }
  .tabs { display: flex; flex: 1 1 100%; border-bottom: 1px solid var(--divider); }
  .tab {
    position: relative; overflow: hidden; flex: 1; max-width: 220px; height: 44px; background: transparent; border: none;
    border-bottom: 2px solid transparent; color: var(--text-2); font: 500 14px 'Roboto', sans-serif;
    letter-spacing: .06em; text-transform: uppercase; cursor: pointer; transition: color .2s, border-color .2s;
  }
  .tab:hover { background: var(--hover); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .field { position: relative; flex: 1 1 240px; }
  .coords { display: flex; gap: 12px; flex: 1 1 240px; }
  .coords .field { flex: 1 1 0; min-width: 0; }
  .field input {
    width: 100%; height: 48px; padding: 12px 14px; font: inherit; font-size: 16px; color: var(--text);
    background: transparent; border: 1px solid var(--border); border-radius: 4px; outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  .field input:hover { border-color: var(--text); }
  .field input:focus { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .field label {
    position: absolute; left: 10px; top: 12px; padding: 0 4px; background: var(--surface);
    color: var(--text-2); pointer-events: none; transform-origin: left top; transition: transform .2s, color .2s;
  }
  .field input:focus + label,
  .field input:not(:placeholder-shown) + label { transform: translateY(-21px) scale(.75); }
  .field input:focus + label { color: var(--accent); }
  .suggest {
    position: absolute; left: 0; right: 0; top: 100%; z-index: 5; margin: 4px 0 0; padding: 8px 0; list-style: none;
    max-height: 320px; overflow-y: auto; background: var(--surface); border-radius: 4px; box-shadow: var(--shadow);
  }
  .suggest li { display: flex; align-items: center; gap: 12px; padding: 8px 16px; cursor: pointer; }
  .suggest li:hover, .suggest li.active { background: var(--hover); }
  .suggest .material-icons { color: var(--text-2); }
  .suggest small { display: block; color: var(--text-2); }
  .btn {
    position: relative; overflow: hidden; display: inline-flex; align-items: center; gap: 8px;
    height: 36px; padding: 0 16px; border-radius: 4px; border: 1px solid transparent;
    font: 500 14px 'Roboto', sans-serif; letter-spacing: .06em; text-transform: uppercase;
    cursor: pointer; transition: background .2s, box-shadow .2s;
  }
  .btn .material-icons { font-size: 18px; }
  .btn-filled { background: var(--primary); color: #fff; box-shadow: var(--shadow); }
  .btn-filled:hover { background: var(--primary-dark); }
  .btn-outlined { background: transparent; color: var(--accent); border-color: var(--border); }
  .btn-outlined:hover { background: var(--hover); }
  .btn:disabled { opacity: .5; cursor: default; }
  .icon-btn {
    position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center;
    width: 40px; height: 40px; padding: 0; border: none; border-radius: 50%;
    background: transparent; color: var(--text-2); cursor: pointer; transition: background .2s, color .2s;
  }
  .icon-btn:hover { background: var(--hover); color: var(--accent); }
  .icon-btn.small { width: 32px; height: 32px; }
  .icon-btn.small .material-icons { font-size: 20px; transition: transform .3s; }
  .icon-btn[aria-expanded="true"] { color: var(--accent); }
  .ripple { position: absolute; border-radius: 50%; background: currentColor; opacity: .3; transform: scale(0); animation: ripple .6s ease-out; pointer-events: none; }
  @keyframes ripple { to { transform: scale(4); opacity: 0; } }
  .error { display: none; align-items: center; gap: 8px; margin-bottom: 16px; padding: 12px 16px; background: var(--error-bg); color: var(--error); border-radius: 4px; border-left: 4px solid var(--error); }
  .error.show { display: flex; }
  .loader { display: none; justify-content: center; padding: 32px 0; }
  .loader.show { display: flex; }
  .spinner { width: 48px; height: 48px; animation: rotate 1.4s linear infinite; }
  .spinner circle { stroke: var(--accent); stroke-width: 4; fill: none; stroke-linecap: round; stroke-dasharray: 80, 200; stroke-dashoffset: 0; animation: dash 1.4s ease-in-out infinite; }
  @keyframes rotate { to { transform: rotate(360deg); } }
  @keyframes dash {
    0% { stroke-dasharray: 1, 200; stroke-dashoffset: 0; }
    50% { stroke-dasharray: 100, 200; stroke-dashoffset: -15; }
    100% { stroke-dasharray: 100, 200; stroke-dashoffset: -125; }
  }
  .results { display: none; }
  .results.show { display: block; }
  .results > * { margin-bottom: 16px; }
  .fade { opacity: 0; transform: translateY(8px); transition: opacity .5s, transform .5s; }
  .results.visible .fade { opacity: 1; transform: none; }
  .results.visible .fade:nth-child(2) { transition-delay: .1s; }
  .results.visible .fade:nth-child(3) { transition-delay: .2s; }
  .grid, .pair { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 768px) {
    .grid { grid-template-columns: 5fr 7fr; align-items: start; }
    .pair { grid-template-columns: 1fr 1fr; align-items: start; }
  }
  .pair.single { grid-template-columns: 1fr; }
  .place-row { display: flex; align-items: center; gap: 4px; }
  .city { font-size: 20px; font-weight: 500; }
  .now-main { display: flex; align-items: center; gap: 16px; margin: 8px 0; }
  .now-icon { font-size: 64px; line-height: 1; }
  .now-temp { font-size: 64px; font-weight: 300; line-height: 1; }
  .desc { font-size: 18px; }
  .muted { color: var(--text-2); }
  .collapse { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .3s ease; }
  .collapse.open { grid-template-rows: 1fr; }
  .collapse > .inner { overflow: hidden; min-height: 0; }
  .info-grid { display: grid; grid-template-columns: 1fr; gap: 12px; padding: 12px 0 4px; }
  @media (min-width: 768px) { .info-grid { grid-template-columns: 1fr 1fr; } }
  .info-item small { display: block; color: var(--text-2); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
  .tile {
    aspect-ratio: 1 / 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    padding: 12px; text-align: center; background: var(--surface); border-radius: 4px; box-shadow: var(--shadow);
  }
  .card .tile { background: var(--bg); box-shadow: none; }
  .tile.colored { border-bottom: 4px solid var(--c); }
  .tile .material-icons { font-size: 32px; color: var(--accent); }
  .tile .emoji { font-size: 32px; line-height: 32px; }
  .tile-v { font-size: 20px; font-weight: 500; overflow-wrap: anywhere; }
  .tile-l { font-size: 12px; color: var(--text-2); }
  .day { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--divider); }
  .day:last-child { border-bottom: none; }
  .day-name { flex: 1; text-transform: capitalize; }
  .day-name small { display: block; color: var(--text-2); text-transform: none; }
  .day-icon { font-size: 28px; }
  .day-desc { flex: 1.4; color: var(--text-2); font-size: 14px; }
  .day-temp { min-width: 84px; text-align: right; }
  @media (max-width: 480px) { .day-desc { display: none; } }
  .backdrop { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(0,0,0,.5); opacity: 0; visibility: hidden; transition: opacity .25s, visibility .25s; }
  .backdrop.open { opacity: 1; visibility: visible; }
  .dialog { width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto; padding: 24px; transform: translateY(16px); transition: transform .25s; box-shadow: 0 11px 15px -7px rgba(0,0,0,.2), 0 24px 38px 3px rgba(0,0,0,.14), 0 9px 46px 8px rgba(0,0,0,.12); }
  .backdrop.open .dialog { transform: none; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 16px 0; }
  .actions { display: flex; justify-content: flex-end; margin-top: 24px; }
  .row select { height: 40px; padding: 0 12px; font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 4px; }
  .row select:focus { outline: none; border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .switch { position: relative; flex: none; width: 40px; height: 20px; }
  .switch input { position: absolute; z-index: 1; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
  .switch .track { position: absolute; left: 0; right: 0; top: 3px; bottom: 3px; border-radius: 7px; background: var(--border); transition: background .2s; }
  .switch .thumb { position: absolute; top: 0; left: 0; width: 20px; height: 20px; border-radius: 50%; background: #fafafa; box-shadow: 0 1px 3px rgba(0,0,0,.4); transition: transform .2s, background .2s; }
  .switch input:checked ~ .track { background: rgba(25,118,210,.5); }
  .switch input:checked ~ .thumb { transform: translateX(20px); background: var(--primary); }
  .switch input:focus-visible ~ .thumb { outline: 2px solid var(--accent); outline-offset: 2px; }
  .now-icon .material-icons { font-size: 64px; color: var(--accent); }
  .day-icon.material-icons { font-size: 28px; color: var(--accent); }
  .card.now { position: relative; }
  .stale { position: absolute; top: 12px; right: 12px; max-width: 150px; display: flex; align-items: center; gap: 4px; font-size: 12px; line-height: 1.2; text-align: right; color: #F57C00; }
  .stale .material-icons { font-size: 16px; }
  body.dark-theme .stale { color: #FFB74D; }
  .hourly { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; scroll-snap-type: x proximity; }
  .hour { flex: 0 0 72px; scroll-snap-align: start; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px; background: var(--bg); border-radius: 4px; text-align: center; }
  .hour .material-icons { color: var(--accent); }
  .hour-time { font-size: 13px; color: var(--text-2); }
  .hour-t { font-weight: 500; }
  .hour-p { font-size: 12px; color: var(--accent); min-height: 15px; }
  .hour-w { font-size: 11px; color: var(--text-2); }
  .hist { display: flex; align-items: stretch; gap: 2px; height: 140px; }
  .hist-col { position: relative; flex: 1 1 0; min-width: 0; }
  .hist-bar { position: absolute; left: 10%; right: 10%; min-height: 3px; border-radius: 2px; }
  .hist-legend { display: flex; justify-content: space-between; margin-top: 8px; font-size: 12px; color: var(--text-2); }
  .hist-sum { margin-top: 8px; font-size: 14px; }
</style>
</head>

<script>
  try { if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-theme'); } catch (e) {}

<div class="container">
  <header class="top">
    <h1><span class="material-icons">cloud</span><span data-i18n="title"></span></h1>
    <button id="settingsBtn" class="icon-btn" data-i18n-aria="settings"><span class="material-icons">settings</span></button>
  </header>
  <div class="card toolbar">
    <div class="tabs" role="tablist">
      <button class="tab active" data-mode="name" role="tab" aria-selected="true" data-i18n="tab_name"></button>
      <button class="tab" data-mode="coords" role="tab" aria-selected="false" data-i18n="tab_coords"></button>
    </div>
    <div class="field" id="nameBox">
      <input id="city" type="text" placeholder=" " autocomplete="off" role="combobox" aria-autocomplete="list" aria-controls="suggest" aria-expanded="false">
      <label for="city" data-i18n="city"></label>
      <ul id="suggest" class="suggest" role="listbox" hidden></ul>
    </div>
    <div class="coords" id="coordsBox" hidden>
      <div class="field"><input id="lat" type="text" inputmode="decimal" placeholder=" " autocomplete="off"><label for="lat" data-i18n="lat"></label></div>
      <div class="field"><input id="lon" type="text" inputmode="decimal" placeholder=" " autocomplete="off"><label for="lon" data-i18n="lon"></label></div>
    </div>
    <button id="search" class="btn btn-filled"><span class="material-icons">search</span><span data-i18n="search"></span></button>
    <button id="locate" class="btn btn-outlined"><span class="material-icons">my_location</span><span data-i18n="locate"></span></button>
  </div>
  <div id="error" class="error" role="alert"><span class="material-icons">error_outline</span><span id="errorText"></span></div>
  <div id="loader" class="loader">
    <svg class="spinner" viewBox="0 0 50 50"><circle cx="25" cy="25" r="20"></circle></svg>
  </div>
  <div id="results" class="results">
    <div class="grid fade">
      <div class="card now">
        <div class="stale" id="staleBadge" hidden><span class="material-icons">history</span><span data-i18n="stale"></span></div>
        <h2 data-i18n="now"></h2>
        <div class="place-row">
          <div class="city" id="place"></div>
          <button id="placeBtn" class="icon-btn small" aria-expanded="false" data-i18n-aria="place_info"><span class="material-icons">info_outline</span></button>
        </div>
        <div id="placeInfo" class="collapse"><div class="inner"><div class="info-grid" id="placeGrid"></div></div></div>
        <div class="now-main">
          <div class="now-icon"><span class="material-icons" id="nowIcon"></span></div>
          <div class="now-temp" id="nowTemp"></div>
        </div>
        <div class="desc" id="nowDesc"></div>
        <div class="muted" id="nowFeels"></div>
      </div>
      <div class="card">
        <h2 data-i18n="forecast"></h2>
        <div id="forecast"></div>
      </div>
    </div>
    <div class="card fade" id="hourlyCard">
      <h2 data-i18n="hourly"></h2>
      <div class="hourly" id="hourly"></div>
    </div>
    <section class="fade">
      <h2 class="section-title" data-i18n="details"></h2>
      <div class="tiles" id="tiles"></div>
    </section>
    <div class="pair fade" id="pair">
      <div class="card" id="airCard">
        <h2 data-i18n="air_quality"></h2>
        <div class="tiles" id="airTiles"></div>
      </div>
      <div class="card">
        <h2 data-i18n="astronomy"></h2>
        <div class="tiles" id="astroTiles"></div>
      </div>
    </div>
    <div class="card fade" id="histCard" hidden>
      <h2 data-i18n="history"></h2>
      <div class="hist" id="hist"></div>
      <div class="hist-legend"><span id="histFrom"></span><span id="histTo"></span></div>
      <div class="hist-sum" id="histSum"></div>
    </div>
  </div>
</div>
<div id="modal" class="backdrop">
  <div class="card dialog" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <h2 id="settingsTitle" data-i18n="settings"></h2>
    <div class="row">
      <span data-i18n="dark"></span>
      <label class="switch"><input id="darkSwitch" type="checkbox"><span class="track"></span><span class="thumb"></span></label>
    </div>
    <div class="row">
      <label for="langSelect" data-i18n="language"></label>
      <select id="langSelect"><option value="ru">Русский</option><option value="en">English</option></select>
    </div>
    <div class="row">
      <label for="searchLangSelect" data-i18n="search_lang"></label>
      <select id="searchLangSelect">
        <option value="ru">Русский (ru)</option><option value="en">English (en)</option><option value="de">Deutsch (de)</option>
        <option value="fr">Français (fr)</option><option value="es">Español (es)</option><option value="it">Italiano (it)</option>
        <option value="pt">Português (pt)</option><option value="tr">Türkçe (tr)</option><option value="zh">中文 (zh)</option><option value="ja">日本語 (ja)</option>
      </select>
    </div>
    <div class="row"><span data-i18n="show_hourly"></span><label class="switch"><input id="hourlySwitch" type="checkbox"><span class="track"></span><span class="thumb"></span></label></div>
    <div class="row"><span data-i18n="show_history"></span><label class="switch"><input id="historySwitch" type="checkbox"><span class="track"></span><span class="thumb"></span></label></div>
    <div class="actions"><button id="closeBtn" class="btn btn-outlined" data-i18n="close"></button></div>
  </div>
</div>

    d.time.forEach(function (iso, idx) {
      var date = new Date(iso + 'T00:00:00');
      var dw = describeWeather(d.weather_code[idx]);
      var row = document.createElement('div');
      row.className = 'day';
      var n = document.createElement('div'); n.className = 'day-name';
      n.textContent = idx === 0 ? t('today') : date.toLocaleDateString(LOCALES[lang], { weekday: 'long' });
      var s = document.createElement('small');
      s.textContent = date.toLocaleDateString(LOCALES[lang], { day: 'numeric', month: 'long' });
      n.appendChild(s);
      var ic = document.createElement('div'); ic.className = 'day-icon material-icons'; ic.textContent = dw.i;
      var ds = document.createElement('div'); ds.className = 'day-desc'; ds.textContent = t(dw.k);
      var tm = document.createElement('div'); tm.className = 'day-temp';
      tm.textContent = fmtTemp(d.temperature_2m_max[idx]) + ' / ' + fmtTemp(d.temperature_2m_min[idx]);
      row.append(n, ic, ds, tm);
      box.appendChild(row);
    });
    $('staleBadge').hidden = !state.stale;
    if (state.ts) $('staleBadge').title = new Date(state.ts).toLocaleString(LOCALES[lang]);
    renderHourly();
    renderHistory();
    var res = $('results');
    res.classList.add('show');
    requestAnimationFrame(function () { requestAnimationFrame(function () { res.classList.add('visible'); }); });
  }
  function run(task, opts) {
    var silent = opts && opts.silent;
    var id = ++requestId;
    if (!silent) setLoading(true);
    task().then(function (res) {
      if (id !== requestId) return;
      if (!silent) setLoading(false);
      state = res;
      if (res.persist) res.persist();
      if (!res.stale) store('lastWeatherData', JSON.stringify(res));
      render();
    }).catch(function (err) {
      if (id !== requestId) return;
      if (silent) { state.stale = true; render(); return; }
      setLoading(false);
      var e = toError(err);
      showError(e.key, e.params);
    });
  }
  function placeTask(place) {
    return fetchAll(place.lat, place.lon).then(function (r) {
      return {
        kind: 'city', label: place.label, place: place.raw, lat: place.lat, lon: place.lon,
        data: r.data, air: r.air, history: r.history, stale: r.stale, ts: Date.now(),
        persist: function () {
          store('lastPlace', JSON.stringify(place));
          store('lastCity', (place.raw && place.raw.name) || place.label);
          store('lastSearchType', 'place');
        }
      };
    });
  }
  function loadPlace(place) { run(function () { return placeTask(place); }); }
  function searchCity(city) {
    city = city.trim();
    if (!city) { showError('err_empty'); return; }
    run(function () {
      return searchPlaces(city, 1).then(function (list) {
        if (!list.length) throw { key: 'err_notfound', params: { city: city } };
        return placeTask(list[0]);
      });
    });
  }
  function loadCoords(kind, getCoords) {
    run(function () {
      return getCoords().then(function (c) {
        return fetchAll(c.latitude, c.longitude).then(function (r) {
          return {
            kind: kind, label: null, coords: { lat: c.latitude, lon: c.longitude }, place: null, lat: c.latitude, lon: c.longitude,
            data: r.data, air: r.air, history: r.history, stale: r.stale, ts: Date.now(),
            persist: function () {
              store('lastLocation', JSON.stringify({ lat: c.latitude, lon: c.longitude }));
              store('lastSearchType', kind);
            }
          };
        });
      });
    });
  }
  function searchByLocation() {
    loadCoords('geo', function () { return getPosition().then(function (p) { return p.coords; }); });
  }
  function parseNum(s) {
    s = s.trim().replace(',', '.');
    return s !== '' && isFinite(s) ? Number(s) : NaN;
  }
  function searchByInputCoords() {
    var lat = parseNum($('lat').value), lon = parseNum($('lon').value);
    if (isNaN(lat) || isNaN(lon)) return showError('err_coords_invalid');
    if (lat < -90 || lat > 90) return showError('err_lat_range');
    if (lon < -180 || lon > 180) return showError('err_lon_range');
    loadCoords('coords', function () { return Promise.resolve({ latitude: lat, longitude: lon }); });
  }
  function submit() {
    cancelSuggest();
    if (mode === 'coords') searchByInputCoords(); else searchCity($('city').value);
  }
  var suggestTimer = null, suggestions = [], activeIdx = -1;
  function hideSuggest() {
    suggestions = []; activeIdx = -1;
    $('suggest').hidden = true;
    $('suggest').innerHTML = '';
    $('city').setAttribute('aria-expanded', 'false');
  }
  function cancelSuggest() { clearTimeout(suggestTimer); suggestId++; hideSuggest(); }
  function renderSuggest(list) {
    suggestions = list; activeIdx = -1;
    var ul = $('suggest');
    ul.innerHTML = '';
    if (!list.length) { hideSuggest(); return; }
    list.forEach(function (p, i) {
      var li = document.createElement('li');
      li.setAttribute('role', 'option');
      li.dataset.index = i;
      var ic = document.createElement('span'); ic.className = 'material-icons'; ic.textContent = 'location_on';
      var box = document.createElement('div');
      var name = document.createElement('div'); name.textContent = p.raw.name;
      var sub = document.createElement('small');
      sub.textContent = [p.raw.admin1, p.raw.country].filter(Boolean).join(', ');
      box.append(name, sub);
      li.append(ic, box);
      ul.appendChild(li);
    });
    ul.hidden = false;
    $('city').setAttribute('aria-expanded', 'true');
  }
  function setActive(i) {
    var items = $('suggest').children;
    if (activeIdx >= 0 && items[activeIdx]) items[activeIdx].classList.remove('active');
    activeIdx = i;
    if (i >= 0 && items[i]) { items[i].classList.add('active'); items[i].scrollIntoView({ block: 'nearest' }); }
  }
  function chooseSuggestion(i) {
    var p = suggestions[i];
    if (!p) return;
    cancelSuggest();
    $('city').value = p.raw.name;
    loadPlace(p);
  }
  $('city').addEventListener('input', function () {
    clearTimeout(suggestTimer);
    var q = $('city').value.trim();
    if (q.length < 2) { suggestId++; hideSuggest(); return; }
    suggestTimer = setTimeout(function () {
      var id = ++suggestId;
      searchPlaces(q, 10).then(function (list) { if (id === suggestId) renderSuggest(list); })
        .catch(function () { if (id === suggestId) hideSuggest(); });
    }, 300);
  });
  $('suggest').addEventListener('click', function (e) {
    var li = e.target.closest('li');
    if (li) chooseSuggestion(Number(li.dataset.index));
  });
  document.addEventListener('click', function (e) { if (!$('nameBox').contains(e.target)) hideSuggest(); });
  $('city').addEventListener('keydown', function (e) {
    var n = suggestions.length;
    if (e.key === 'ArrowDown' && n) { e.preventDefault(); setActive((activeIdx + 1) % n); }
    else if (e.key === 'ArrowUp' && n) { e.preventDefault(); setActive((activeIdx - 1 + n) % n); }
    else if (e.key === 'Escape') hideSuggest();
    else if (e.key === 'Enter') { if (activeIdx >= 0) chooseSuggestion(activeIdx); else submit(); }
  });
  function setMode(m) {
    mode = m;
    cancelSuggest();
    $('nameBox').hidden = m !== 'name';
    $('coordsBox').hidden = m !== 'coords';
    document.querySelectorAll('.tab').forEach(function (tab) {
      var on = tab.dataset.mode === m;
      tab.classList.toggle('active', on);
      tab.setAttribute('aria-selected', on);
    });
  }
  document.querySelectorAll('.tab').forEach(function (tab) {
    tab.addEventListener('click', function () { setMode(tab.dataset.mode); });
  });
  ['lat', 'lon'].forEach(function (id) {
    $(id).addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
  });
  function applyLang() {
    document.documentElement.lang = lang;
    document.title = t('title');
    document.querySelectorAll('[data-i18n]').forEach(function (el) { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll('[data-i18n-aria]').forEach(function (el) { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
    $('langSelect').value = lang;
    if (errState) showError(errState.key, errState.params);
    render();
  }
  function setTheme(dark) {
    document.body.classList.toggle('dark-theme', dark);
    store('theme', dark ? 'dark' : 'light');
  }
  document.querySelectorAll('.btn, .icon-btn, .tab').forEach(function (btn) {
    btn.addEventListener('click', function (e) {
      var rect = btn.getBoundingClientRect();
      var size = Math.max(rect.width, rect.height);
      var span = document.createElement('span');
      span.className = 'ripple';
      span.style.width = span.style.height = size + 'px';
      span.style.left = (e.clientX - rect.left - size / 2) + 'px';
      span.style.top = (e.clientY - rect.top - size / 2) + 'px';
      btn.appendChild(span);
      span.addEventListener('animationend', function () { span.remove(); });
    });
  });
  $('search').addEventListener('click', submit);
  $('locate').addEventListener('click', function () { cancelSuggest(); searchByLocation(); });
  $('placeBtn').addEventListener('click', function () {
    setExpanded($('placeBtn'), $('placeInfo'), $('placeBtn').getAttribute('aria-expanded') !== 'true');
  });
  var modal = $('modal');
  function openModal() { modal.classList.add('open'); $('closeBtn').focus(); }
  function closeModal() { modal.classList.remove('open'); $('settingsBtn').focus(); }
  $('settingsBtn').addEventListener('click', openModal);
  $('closeBtn').addEventListener('click', closeModal);
  modal.addEventListener('click', function (e) { if (e.target === modal) closeModal(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && modal.classList.contains('open')) closeModal(); });
  $('darkSwitch').addEventListener('change', function (e) { setTheme(e.target.checked); });
  $('langSelect').addEventListener('change', function (e) { lang = e.target.value; store('lang', lang); applyLang(); });
  $('searchLangSelect').addEventListener('change', function (e) { searchLang = e.target.value; store('searchLang', searchLang); cancelSuggest(); });
  $('hourlySwitch').addEventListener('change', function (e) { showHourly = e.target.checked; store('showHourly', showHourly ? '1' : '0'); render(); });
  $('historySwitch').addEventListener('change', function (e) {
    showHistory = e.target.checked;
    store('showHistory', showHistory ? '1' : '0');
    ensureHistory();
    render();
  });
  function ensureHistory() {
    var s = state;
    if (!showHistory || !s || s.history || s.lat == null) return;
    withTimeout(fetchHistory(s.lat, s.lon), 10000).then(function (h) {
      if (state !== s) return;
      s.history = h;
      store('lastWeatherData', JSON.stringify(s));
      render();
    }).catch(function () {});
  }
  function refresh() {
    var s = state;
    run(function () {
      return fetchAll(s.lat, s.lon).then(function (r) {
        return Object.assign({}, s, { data: r.data, air: r.air, history: r.history || s.history, stale: r.stale, ts: Date.now() });
      });
    }, { silent: true });
  }
  $('darkSwitch').checked = document.body.classList.contains('dark-theme');
  $('hourlySwitch').checked = showHourly;
  $('historySwitch').checked = showHistory;
  $('searchLangSelect').value = searchLang;
  applyLang();
  var savedCity = load('lastCity');
  var type = load('lastSearchType');
  var savedPlace = loadJson('lastPlace');
  var loc = loadJson('lastLocation');
  var cached = loadJson('lastWeatherData');
  if (savedCity) $('city').value = savedCity;
  if (type === 'coords' && loc && isFinite(loc.lat) && isFinite(loc.lon)) { $('lat').value = loc.lat; $('lon').value = loc.lon; setMode('coords'); }
  if (cached && cached.data && cached.data.current && cached.data.daily && cached.lat != null) {
    state = cached;
    render();
    ensureHistory();
    refresh();
  } else if (type === 'place' && savedPlace && isFinite(savedPlace.lat) && isFinite(savedPlace.lon)) {
    loadPlace(savedPlace);
  } else if ((type === 'geo' || type === 'coords') && loc && isFinite(loc.lat) && isFinite(loc.lon)) {
    loadCoords(type, function () { return Promise.resolve({ latitude: loc.lat, longitude: loc.lon }); });
  } else if (savedCity) {
    searchCity(savedCity);
  }
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('./sw.js').catch(function () {}); });
  }
})();
</script>
</body>
</html>
