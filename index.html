<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="favicon.ico">
<title>Weather</title>
<meta name="theme-color" content="#1976D2">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
  :root {
    --primary: #1976D2;
    --primary-dark: #1565C0;
    --accent: #1976D2;
    --surface: #FFFFFF;
    --bg: #F5F5F5;
    --text: #212121;
    --text-2: #616161;
    --border: #9e9e9e;
    --divider: #eeeeee;
    --hover: rgba(25,118,210,.08);
    --track-on: rgba(25,118,210,.5);
    --error: #D32F2F;
    --error-bg: #FDECEA;
    --shadow: 0 2px 2px rgba(0,0,0,.14), 0 3px 1px -2px rgba(0,0,0,.12), 0 1px 5px rgba(0,0,0,.2);
    --ease-enter: cubic-bezier(0.4, 0.0, 0.2, 1);
    --ease-exit: cubic-bezier(0.4, 0.0, 1, 1);
    --motion-fast: 180ms;
    --motion-standard: 300ms;
  }
  body.dark-theme {
    --accent: #64B5F6;
    --surface: #1E1E1E;
    --bg: #121212;
    --text: #EEEEEE;
    --text-2: #B0B0B0;
    --border: #757575;
    --divider: #333333;
    --hover: rgba(100,181,246,.12);
    --error: #EF9A9A;
    --error-bg: #3B2020;
    --shadow: 0 2px 2px rgba(0,0,0,.5), 0 3px 1px -2px rgba(0,0,0,.5), 0 1px 5px rgba(0,0,0,.6);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { min-height: 100%; background: var(--bg); }
  html.dark-theme { background-color: #121212; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Roboto', Arial, sans-serif; line-height: 1.4; transition: opacity .3s var(--ease-exit); }
  body.reloading { opacity: 0; pointer-events: none; }
  .container { max-width: 960px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px 16px; }
  .top { display: flex; align-items: center; justify-content: space-between; margin: 8px 0 16px; }
  h1 { font-size: 24px; font-weight: 500; margin: 0; display: flex; align-items: center; gap: 8px; }
  h1 .material-icons { color: var(--accent); }
  .card { background: var(--surface); border-radius: 4px; box-shadow: var(--shadow); padding: 16px; }
  .card h2, .section-title { margin: 0 0 12px; font-size: 18px; font-weight: 500; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 16px; }
  .tabs { display: flex; flex: 1 1 100%; border-bottom: 1px solid var(--divider); }
  .tab {
    position: relative; overflow: hidden; flex: 1; max-width: 220px; height: 44px; background: transparent; border: none;
    border-bottom: 2px solid transparent; color: var(--text-2); font: 500 14px 'Roboto', sans-serif;
    letter-spacing: .06em; text-transform: uppercase; cursor: pointer;
  }
  .tab:hover { background: var(--hover); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .field { position: relative; flex: 1 1 240px; }
  .coords { display: flex; gap: 12px; flex: 1 1 240px; }
  .coords .field { flex: 1 1 0; min-width: 0; }
  .field input {
    width: 100%; height: 48px; padding: 12px 14px; font: inherit; font-size: 16px; color: var(--text);
    background: transparent; border: 1px solid var(--border); border-radius: 4px; outline: none;
    transition: border-color .3s var(--ease-enter), box-shadow .2s var(--ease-enter), background-color .3s var(--ease-enter), color .3s var(--ease-enter);
  }
  .field input:hover { border-color: var(--text); }
  .field input:focus { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .field label {
    position: absolute; left: 10px; top: 12px; padding: 0 4px; background: var(--surface);
    color: var(--text-2); pointer-events: none; transform-origin: left top; transition: transform .2s var(--ease-enter), color .3s var(--ease-enter), background-color .3s var(--ease-enter);
  }
  .field input:focus + label,
  .field input:not(:placeholder-shown) + label { transform: translateY(-21px) scale(.75); }
  .field input:focus + label { color: var(--accent); }
  .suggest {
    position: absolute; left: 0; right: 0; top: 100%; z-index: 5; margin: 4px 0 0; padding: 8px 0; list-style: none;
    max-height: 320px; overflow-y: auto; background: var(--surface); border-radius: 4px; box-shadow: var(--shadow);
  }
  .suggest li { display: flex; align-items: center; gap: 12px; padding: 8px 16px; cursor: pointer; }
  .suggest li:hover, .suggest li.active { background: var(--hover); }
  .suggest .material-icons { color: var(--text-2); }
  .suggest small { display: block; color: var(--text-2); }
  .btn {
    position: relative; overflow: hidden; display: inline-flex; align-items: center; gap: 8px;
    height: 36px; padding: 0 16px; border-radius: 4px; border: 1px solid transparent;
    font: 500 14px 'Roboto', sans-serif; letter-spacing: .06em; text-transform: uppercase;
    cursor: pointer; transition: background-color .2s var(--ease-enter), box-shadow .2s var(--ease-enter), color .2s var(--ease-enter), border-color .2s var(--ease-enter);
  }
  .btn .material-icons { font-size: 18px; }
  .btn-filled { background: var(--primary); color: #fff; box-shadow: var(--shadow); }
  .btn-filled:hover { background: var(--primary-dark); }
  .btn-outlined { background: transparent; color: var(--accent); border-color: var(--border); }
  .btn-outlined:hover { background: var(--hover); }
  .btn:disabled { opacity: .5; cursor: default; }
  .icon-btn {
    position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center;
    width: 40px; height: 40px; padding: 0; border: none; border-radius: 50%;
    background: transparent; color: var(--text-2); cursor: pointer; transition: background-color .2s var(--ease-enter), color .2s var(--ease-enter), border-color .2s var(--ease-enter);
  }
  .icon-btn:hover { background: var(--hover); color: var(--accent); }
  .icon-btn.small { width: 32px; height: 32px; }
  .icon-btn.small .material-icons { font-size: 20px; transition: transform .3s var(--ease-enter), color .3s var(--ease-enter); }
  .icon-btn[aria-expanded="true"] { color: var(--accent); }
  .ripple { position: absolute; border-radius: 50%; background: currentColor; opacity: .3; transform: scale(0); animation: ripple .6s var(--ease-exit); pointer-events: none; }
  @keyframes ripple { to { transform: scale(4); opacity: 0; } }
  .error { display: none; align-items: center; gap: 8px; margin-bottom: 16px; padding: 12px 16px; background: var(--error-bg); color: var(--error); border-radius: 4px; border-left: 4px solid var(--error); }
  .error.show { display: flex; }
  .loader { display: none; justify-content: center; padding: 32px 0; }
  .loader.show { display: flex; }
  .spinner { width: 48px; height: 48px; animation: rotate 1.4s linear infinite; }
  .spinner circle { stroke: var(--accent); stroke-width: 4; fill: none; stroke-linecap: round; stroke-dasharray: 80, 200; stroke-dashoffset: 0; animation: dash 1.4s ease-in-out infinite; }
  @keyframes rotate { to { transform: rotate(360deg); } }
  @keyframes dash {
    0% { stroke-dasharray: 1, 200; stroke-dashoffset: 0; }
    50% { stroke-dasharray: 100, 200; stroke-dashoffset: -15; }
    100% { stroke-dasharray: 100, 200; stroke-dashoffset: -125; }
  }
  .results { display: none; }
  .results.show { display: block; }
  .results > * { margin-bottom: 16px; }
  .fade { opacity: 0; transition: opacity .3s ease; }
  .results.visible .fade { opacity: 1; }
  .results.visible > .fade:nth-child(1) { transition-delay: 0ms; }
  .results.visible > .fade:nth-child(2) { transition-delay: 100ms; }
  .results.visible > .fade:nth-child(3) { transition-delay: 200ms; }
  .results.visible > .fade:nth-child(n+4) { transition-delay: 200ms; }
  .mode-panel { transition: none; }
  .grid, .pair { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 768px) {
    .grid { grid-template-columns: 5fr 7fr; align-items: start; }
    .pair { grid-template-columns: 1fr 1fr; align-items: start; }
  }
  .pair.single { grid-template-columns: 1fr; }
  .place-row { display: flex; align-items: center; gap: 4px; }
  .city { font-size: 20px; font-weight: 500; }
  .now-main { display: flex; align-items: center; gap: 16px; margin: 8px 0; }
  .now-icon { font-size: 64px; line-height: 1; }
  .now-temp { font-size: 64px; font-weight: 300; line-height: 1; }
  .desc { font-size: 18px; }
  .muted { color: var(--text-2); }
  .collapse { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .3s var(--ease-enter); }
  .collapse.open { grid-template-rows: 1fr; }
  .collapse > .inner { overflow: hidden; min-height: 0; }
  .info-grid { display: grid; grid-template-columns: 1fr; gap: 12px; padding: 12px 0 4px; }
  @media (min-width: 768px) { .info-grid { grid-template-columns: 1fr 1fr; } }
  .info-item small { display: block; color: var(--text-2); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
  .tile {
    aspect-ratio: 1 / 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    padding: 12px; text-align: center; background: var(--surface); border-radius: 4px; box-shadow: var(--shadow);
  }
  .card .tile { background: var(--bg); box-shadow: none; }
  .tile.colored { border-bottom: 4px solid var(--c); }
  .tile .material-icons { font-size: 32px; color: var(--accent); }
  .tile .emoji { font-size: 32px; line-height: 32px; }
  .tile-v { font-size: 20px; font-weight: 500; overflow-wrap: anywhere; }
  .tile-l { font-size: 12px; color: var(--text-2); }
  .day { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--divider); }
  .day:last-child { border-bottom: none; }
  .day-name { flex: 1; text-transform: capitalize; }
  .day-name small { display: block; color: var(--text-2); text-transform: none; }
  .day-icon { font-size: 28px; }
  .day-desc { flex: 1.4; color: var(--text-2); font-size: 14px; }
  .day-temp { min-width: 84px; text-align: right; }
  @media (max-width: 480px) { .day-desc { display: none; } }
  .backdrop { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(0,0,0,.5); opacity: 0; visibility: hidden; transition: opacity .3s var(--ease-exit), visibility 0s linear .3s; }
  .backdrop.open { opacity: 1; visibility: visible; transition: opacity .3s var(--ease-enter), visibility 0s linear 0s; }
  .dialog { width: 100%; max-width: 680px; max-height: 90vh; overflow-y: auto; padding: 24px; transform: translateY(30px) scale(.95); transform-origin: center; transition: transform .3s var(--ease-exit); box-shadow: 0 11px 15px -7px rgba(0,0,0,.2), 0 24px 38px 3px rgba(0,0,0,.14), 0 9px 46px 8px rgba(0,0,0,.12); }
  .backdrop.open .dialog { transform: translateY(0) scale(1); transition-timing-function: var(--ease-enter); }
  .json-backdrop { z-index: 20; background: rgba(0,0,0,.62); }
  .json-dialog { max-width: 760px; }
  .json-content { max-height: 60vh; overflow: auto; padding: 16px; border-radius: 4px; background: var(--bg); color: var(--text); font: 12px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 16px 0; }
  .actions { display: flex; justify-content: flex-end; margin-top: 24px; }
  .row select { height: 40px; padding: 0 12px; font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 4px; }
  .row select:focus { outline: none; border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .switch { position: relative; flex: none; width: 40px; height: 20px; }
  .switch input { position: absolute; z-index: 1; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
  .switch .track { position: absolute; left: 0; right: 0; top: 3px; bottom: 3px; border-radius: 7px; background: var(--border); transition: background-color .2s ease; }
  .switch .thumb { position: absolute; top: 0; left: 0; width: 20px; height: 20px; border-radius: 50%; background: #fafafa; box-shadow: 0 1px 3px rgba(0,0,0,.4); transition: transform .2s ease, background-color .2s ease; }
  .switch input:checked ~ .track { background: var(--track-on); }
  .switch input:checked ~ .thumb { transform: translateX(20px); background: var(--primary); }
  .switch input:focus-visible ~ .thumb { outline: 2px solid var(--accent); outline-offset: 2px; }
  .now-icon .material-icons { font-size: 64px; color: var(--accent); }
  .day-icon.material-icons { font-size: 28px; color: var(--accent); }
  .card.now { position: relative; }
  .stale { position: absolute; top: 12px; right: 12px; max-width: 150px; display: flex; align-items: center; gap: 4px; font-size: 12px; line-height: 1.2; text-align: right; color: #F57C00; }
  .stale .material-icons { font-size: 16px; }
  body.dark-theme .stale { color: #FFB74D; }
  .hourly { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; scroll-snap-type: x proximity; }
  .hour { flex: 0 0 72px; scroll-snap-align: start; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px; background: var(--bg); border-radius: 4px; text-align: center; }
  .hour .material-icons { color: var(--accent); }
  .hour-time { font-size: 13px; color: var(--text-2); }
  .hour-t { font-weight: 500; }
  .hour-p { font-size: 12px; color: var(--accent); min-height: 15px; }
  .hour-w { font-size: 11px; color: var(--text-2); }
  .hist { display: flex; align-items: stretch; gap: 2px; height: 140px; }
  .hist-col { position: relative; flex: 1 1 0; min-width: 0; }
  .hist-bar { position: absolute; left: 10%; right: 10%; min-height: 3px; border-radius: 2px; }
  .hist-legend { display: flex; justify-content: space-between; margin-top: 8px; font-size: 12px; color: var(--text-2); }
  .hist-sum { margin-top: 8px; font-size: 14px; }
  .updated { margin-top: 8px; font-size: 12px; }
  .sec-title { margin: 24px 0 0; padding-top: 16px; border-top: 1px solid var(--divider); font-size: 12px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--text-2); }
  .swatches { display: flex; flex-wrap: wrap; gap: 12px; margin: 16px 0 0; }
  .swatch {
    display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; padding: 0;
    border: 2px solid transparent; border-radius: 50%; background: var(--sw); color: #fff; cursor: pointer;
    box-shadow: var(--shadow); transition: box-shadow .2s var(--ease-enter), border-color .2s var(--ease-enter), background-color .3s var(--ease-enter);
  }
  .swatch .material-icons { font-size: 20px; opacity: 0; transition: opacity .2s var(--ease-enter); }
  .swatch[aria-checked="true"] { border-color: var(--surface); box-shadow: 0 0 0 2px var(--sw); }
  .swatch[aria-checked="true"] .material-icons { opacity: 1; }
  .swatch:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
  .welcome {
    position: fixed; inset: 0; z-index: 100; display: flex; overflow-y: auto; background: var(--bg);
    padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px));
  }
  .welcome-card { width: 100%; max-width: 440px; margin: auto; padding: 32px 24px 24px; }
  .welcome .logo { display: block; margin: 0 auto 8px; font-size: 64px; color: var(--accent); text-align: center; }
  .welcome h2 { margin: 0 0 8px; font-size: 24px; text-align: center; }
  .welcome p { margin: 0 0 8px; color: var(--text-2); text-align: center; }
  .welcome .actions { margin-top: 24px; }
  .welcome .btn { width: 100%; height: 44px; justify-content: center; }
  .advanced { margin-top: 20px; border-top: 1px solid var(--divider); border-bottom: 1px solid var(--divider); }
  .advanced > summary { padding: 16px 0; cursor: pointer; color: var(--accent); font-weight: 500; letter-spacing: .04em; user-select: none; }
  .advanced > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .advanced-content { padding: 0 0 12px; }
  .advanced-warning { display: flex; gap: 10px; align-items: flex-start; margin: 0 0 16px; padding: 14px; border-left: 4px solid var(--error); border-radius: 4px; background: var(--error-bg); color: var(--error); font-weight: 500; }
  .advanced-warning .material-icons { flex: none; font-size: 24px; }
  .storage-status { min-height: 20px; margin: 0 0 8px; color: var(--accent); font-size: 13px; }
  .storage-admin-row { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 8px; padding: 12px 0; border-bottom: 1px solid var(--divider); }
  .storage-admin-row:last-child { border-bottom: 0; }
  .storage-field { flex: 1 1 220px; min-width: 0; }
  .storage-key { display: block; margin-bottom: 5px; font-size: 13px; font-weight: 500; overflow-wrap: anywhere; }
  .storage-input { width: 100%; min-width: 0; min-height: 40px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px; background: transparent; color: var(--text); font: 14px 'Roboto', sans-serif; }
  .storage-input:focus { outline: none; border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .storage-actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .storage-btn { height: 36px; padding: 0 10px; font-size: 12px; letter-spacing: .03em; }
  .storage-json-note { display: block; margin-top: 5px; color: var(--text-2); font-size: 12px; }
  @media (max-width: 480px) { .dialog { padding: 20px 16px; } .storage-admin-row { gap: 7px; } .storage-btn { flex: 1 1 auto; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<script>
  (function () {
    try {
      var th = localStorage.getItem('theme');
      var dark = th === 'dark' || (th !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) { document.body.classList.add('dark-theme'); document.documentElement.classList.add('dark-theme'); }
    } catch (e) {}
  })();
</script>
<div class="container">
  <header class="top">
    <h1><span class="material-icons">cloud</span><span data-i18n="title"></span></h1>
    <button id="settingsBtn" class="icon-btn" data-i18n-aria="settings"><span class="material-icons">settings</span></button>
  </header>
  <div class="card toolbar">
    <div class="tabs" role="tablist">
      <button class="tab active" data-mode="name" role="tab" aria-selected="true" data-i18n="tab_name"></button>
      <button class="tab" data-mode="coords" role="tab" aria-selected="false" data-i18n="tab_coords"></button>
    </div>
    <div class="field mode-panel" id="nameBox">
      <input id="city" type="text" placeholder=" " autocomplete="off" role="combobox" aria-autocomplete="list" aria-controls="suggest" aria-expanded="false">
      <label for="city" data-i18n="city"></label>
      <ul id="suggest" class="suggest" role="listbox" hidden></ul>
    </div>
    <div class="coords mode-panel" id="coordsBox" hidden>
      <div class="field"><input id="lat" type="text" inputmode="decimal" placeholder=" " autocomplete="off"><label for="lat" data-i18n="lat"></label></div>
      <div class="field"><input id="lon" type="text" inputmode="decimal" placeholder=" " autocomplete="off"><label for="lon" data-i18n="lon"></label></div>
    </div>
    <button id="search" class="btn btn-filled"><span class="material-icons">search</span><span data-i18n="search"></span></button>
    <button id="locate" class="btn btn-outlined"><span class="material-icons">my_location</span><span data-i18n="locate"></span></button>
  </div>
  <div id="error" class="error" role="alert"><span class="material-icons">error_outline</span><span id="errorText"></span></div>
  <div id="loader" class="loader">
    <svg class="spinner" viewBox="0 0 50 50"><circle cx="25" cy="25" r="20"></circle></svg>
  </div>
  <div id="results" class="results">
    <div class="grid fade">
      <div class="card now">
        <div class="stale" id="staleBadge" hidden><span class="material-icons">history</span><span data-i18n="stale"></span></div>
        <h2 data-i18n="now"></h2>
        <div class="place-row">
          <div class="city" id="place"></div>
          <button id="placeBtn" class="icon-btn small" aria-expanded="false" data-i18n-aria="place_info"><span class="material-icons">info_outline</span></button>
        </div>
        <div id="placeInfo" class="collapse"><div class="inner"><div class="info-grid" id="placeGrid"></div></div></div>
        <div class="now-main">
          <div class="now-icon"><span class="material-icons" id="nowIcon"></span></div>
          <div class="now-temp" id="nowTemp"></div>
        </div>
        <div class="desc" id="nowDesc"></div>
        <div class="muted" id="nowFeels"></div>
        <div class="muted updated" id="updated" hidden></div>
      </div>
      <div class="card">
        <h2 data-i18n="forecast"></h2>
        <div id="forecast"></div>
      </div>
    </div>
    <div class="card fade" id="hourlyCard">
      <h2 data-i18n="hourly"></h2>
      <div class="hourly" id="hourly"></div>
    </div>
    <section class="fade">
      <h2 class="section-title" data-i18n="details"></h2>
      <div class="tiles" id="tiles"></div>
    </section>
    <div class="pair fade" id="pair">
      <div class="card" id="airCard">

  function setTheme(dark) { themeManual = true; applyTheme(dark); store('theme', dark ? 'dark' : 'light'); }
  var ACCENTS = [
    { id: 'blue', c: '#1976D2', d: '#64B5F6' }, { id: 'green', c: '#388E3C', d: '#81C784' },
    { id: 'purple', c: '#7B1FA2', d: '#BA68C8' }, { id: 'orange', c: '#F57C00', d: '#FFB74D' },
    { id: 'red', c: '#D32F2F', d: '#E57373' }, { id: 'teal', c: '#00796B', d: '#4DB6AC' }
  ];
  var accent = (function () {
    var s = load('accentColor');
    return ACCENTS.some(function (a) { return a.c === s; }) ? s : ACCENTS[0].c;
  })();
  function hexRgb(h) { return [1, 3, 5].map(function (i) { return parseInt(h.substr(i, 2), 16); }); }
  function applyAccent() {
    var a = ACCENTS.filter(function (x) { return x.c === accent; })[0] || ACCENTS[0];
    var dark = document.body.classList.contains('dark-theme');
    var shown = dark ? a.d : a.c, s = document.body.style;
    s.setProperty('--primary', a.c);
    s.setProperty('--primary-dark', 'rgb(' + hexRgb(a.c).map(function (x) { return Math.round(x * 0.88); }).join(',') + ')');
    s.setProperty('--accent', shown);
    s.setProperty('--hover', 'rgba(' + hexRgb(shown).join(',') + ',' + (dark ? 0.12 : 0.08) + ')');
    s.setProperty('--track-on', 'rgba(' + hexRgb(a.c).join(',') + ',.5)');
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', a.c);
    document.querySelectorAll('.swatch').forEach(function (b) { b.setAttribute('aria-checked', b.dataset.color === a.c); });
  }
  function setAccent(c) { accent = c; store('accentColor', c); applyAccent(); }
  function buildSwatches() {
    var box = $('swatches');
    ACCENTS.forEach(function (a) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'swatch'; b.dataset.color = a.c; b.dataset.id = a.id;
      b.setAttribute('role', 'radio');
      b.style.setProperty('--sw', a.c);
      b.appendChild(el('span', 'material-icons', 'check'));
      b.addEventListener('click', function () { setAccent(a.c); });
      box.appendChild(b);
    });
  }
  function labelSwatches() {
    document.querySelectorAll('.swatch').forEach(function (b) {
      b.title = t('c_' + b.dataset.id);
      b.setAttribute('aria-label', t('c_' + b.dataset.id));
    });
  }
  var unitSelects = [];
  function buildUnitSelects() {
    ['unitRows', 'welcomeUnitRows'].forEach(function (boxId) {
      UNIT_KINDS.forEach(function (kind) {
        var row = el('div', 'row'), lab = document.createElement('label'), sel = document.createElement('select');
        sel.id = boxId + '-' + kind;
        lab.htmlFor = sel.id;
        Object.keys(UNIT_DEFS[kind].opts).forEach(function (k) {
          var o = document.createElement('option'); o.value = k; sel.appendChild(o);
        });
        sel.addEventListener('change', function () { setUnit(kind, sel.value); });
        row.append(lab, sel);
        $(boxId).appendChild(row);
        unitSelects.push({ kind: kind, sel: sel, lab: lab });
      });
    });
  }
  function labelUnitSelects() {
    unitSelects.forEach(function (u) {
      u.lab.textContent = t('unit_' + u.kind);
      Array.prototype.forEach.call(u.sel.options, function (o) { o.textContent = unitOptionLabel(u.kind, o.value); });
      u.sel.value = units[u.kind];
    });
  }
  function setUnit(kind, v) { units[kind] = v; store(UNIT_DEFS[kind].key, v); labelUnitSelects(); render(); }

  var STORAGE_KEYS = [
    'lang', 'theme', 'searchLang', 'unitTemp', 'unitWind', 'unitPressure', 'unitPrecip',
    'onboarded', 'lastCity', 'lastPlace', 'lastLocation', 'lastWeatherData', 'lastSearchType',
    'accentColor', 'showHourly', 'showHistory'
  ];
  function storageRead(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }
  function storedObject(raw) {
    if (raw === null) return null;
    try {
      var value = JSON.parse(raw);
      return value !== null && typeof value === 'object' ? value : null;
    } catch (e) { return null; }
  }
  function storageButton(label, onClick) {
    var button = document.createElement('button');
    button.type = 'button'; button.className = 'btn btn-outlined storage-btn';
    button.textContent = label;
    button.addEventListener('click', onClick);
    return button;
  }
  function renderStorageRows(message) {
    var root = $('storageRows');
    if (!root) return;
    root.innerHTML = '';
    var status = $('storageStatus');
    if (status) status.textContent = message || '';
    var keys = STORAGE_KEYS.slice();
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var extra = localStorage.key(i);
        if (extra && keys.indexOf(extra) < 0) keys.push(extra);
      }
    } catch (e) {}
    var extras = keys.slice(STORAGE_KEYS.length).sort();
    keys = STORAGE_KEYS.concat(extras);
    keys.forEach(function (key) {
      var raw = storageRead(key);
      var obj = storedObject(raw);
      var row = el('div', 'storage-admin-row');
      var field = el('div', 'storage-field');
      var label = el('label', 'storage-key', key);
      label.htmlFor = 'storage-key-' + root.children.length;
      field.appendChild(label);
      if (obj !== null) {
        field.appendChild(el('span', 'storage-json-note', t('stored_json')));
        var actions = el('div', 'storage-actions');
        actions.appendChild(storageButton(t('view_json'), function () { openJsonViewer(key, obj); }));
        actions.appendChild(storageButton(t('clear'), function () { deleteStorageKey(key); }));
        row.append(field, actions);
      } else {
        var input = document.createElement('input');
        input.type = 'text'; input.className = 'storage-input'; input.id = label.htmlFor;
        input.autocomplete = 'off'; input.spellcheck = false;
        input.value = raw === null ? '' : raw;
        input.setAttribute('aria-label', key);
        field.appendChild(input);
        var actions2 = el('div', 'storage-actions');
        actions2.appendChild(storageButton(t('save'), function () { saveStorageKey(key, input.value); }));
        actions2.appendChild(storageButton(t('delete'), function () { deleteStorageKey(key); }));
        row.append(field, actions2);
      }
      root.appendChild(row);
    });
  }
  function openJsonViewer(key, value) {
    $('jsonTitle').textContent = t('json_title') + ': ' + key;
    try { $('jsonContent').textContent = JSON.stringify(value, null, 2); }
    catch (e) { $('jsonContent').textContent = String(value); }
    $('modal').inert = true;
    $('jsonModal').classList.add('open');
    $('jsonClose').focus();
  }
  function closeJsonViewer() {
    $('jsonModal').classList.remove('open');
    $('modal').inert = false;
    var summary = $('advancedDetails').querySelector('summary');
    if (summary) summary.focus();
  }
  function applyStorageChange(key, raw, removed) {
    if (key === 'lang') {
      lang = !removed && (raw === 'ru' || raw === 'en') ? raw : detectLang();
      applyLang();
      return;
    }
    if (key === 'theme') {
      themeManual = !removed && (raw === 'dark' || raw === 'light');
      applyTheme(themeManual ? raw === 'dark' : systemDark());
      return;
    }
    if (key === 'searchLang') {
      searchLang = !removed && SEARCH_LANGS.indexOf(raw) >= 0 ? raw : detectLang();
      $('searchLangSelect').value = searchLang;
      cancelSuggest();
      return;
    }
    var unitKind = UNIT_KINDS.filter(function (kind) { return UNIT_DEFS[kind].key === key; })[0];
    if (unitKind) {
      var def = UNIT_DEFS[unitKind];
      units[unitKind] = !removed && Object.prototype.hasOwnProperty.call(def.opts, raw) ? raw : def.def;
      labelUnitSelects();
      render();
      return;
    }
    if (key === 'accentColor') {
      accent = !removed && ACCENTS.some(function (a) { return a.c === raw; }) ? raw : ACCENTS[0].c;
      applyAccent();
      return;
    }
    if (key === 'showHourly') {
      showHourly = removed || raw !== '0';
      $('hourlySwitch').checked = showHourly;
      render();
      return;
    }
    if (key === 'showHistory') {
      showHistory = !removed && raw === '1';
      $('historySwitch').checked = showHistory;
      if (showHistory) ensureHistory();
      render();
      return;
    }
    if (key === 'lastCity') $('city').value = removed ? '' : raw;
  }
  function saveStorageKey(key, value) {
    try { localStorage.setItem(key, value); }
    catch (e) { renderStorageRows(t('storage_error')); return; }
    applyStorageChange(key, value, false);
    renderStorageRows(t('storage_saved'));
  }
  function deleteStorageKey(key) {
    try { localStorage.removeItem(key); }
    catch (e) { renderStorageRows(t('storage_error')); return; }
    applyStorageChange(key, null, true);
    renderStorageRows(t('storage_deleted'));
  }
  $('advancedDetails').addEventListener('toggle', function () {
    if ($('advancedDetails').open) renderStorageRows();
  });
  function openWelcome() {
    $('welcome').hidden = false;
    document.querySelector('.container').inert = true;
    $('modal').inert = true;
    document.body.style.overflow = 'hidden';
    $('startBtn').focus();
  }
  function closeWelcome() {
    store('lang', lang);
    UNIT_KINDS.forEach(function (kind) { store(UNIT_DEFS[kind].key, units[kind]); });
    if (themeManual) store('theme', $('welcomeDark').checked ? 'dark' : 'light');
    store('onboarded', '1');
    document.querySelector('.container').inert = false;
    $('modal').inert = false;
    $('jsonModal').inert = false;
    document.body.style.overflow = '';
    document.body.classList.add('reloading');
    window.setTimeout(function () { window.location.reload(); }, 300);
  }
  document.querySelectorAll('.btn, .icon-btn, .tab').forEach(function (btn) {
    btn.addEventListener('click', function (e) {
      var rect = btn.getBoundingClientRect();
      var size = Math.max(rect.width, rect.height);
      var span = document.createElement('span');
      span.className = 'ripple';
      span.style.width = span.style.height = size + 'px';
      span.style.left = (e.clientX - rect.left - size / 2) + 'px';
      span.style.top = (e.clientY - rect.top - size / 2) + 'px';
      btn.appendChild(span);
      span.addEventListener('animationend', function () { span.remove(); });
    });
  });
  $('search').addEventListener('click', submit);
  $('locate').addEventListener('click', function () { cancelSuggest(); searchByLocation(); });
  $('placeBtn').addEventListener('click', function () {
    setExpanded($('placeBtn'), $('placeInfo'), $('placeBtn').getAttribute('aria-expanded') !== 'true');
  });
  var modal = $('modal');
  var jsonModal = $('jsonModal');
  function openModal() { modal.classList.add('open'); $('closeBtn').focus(); }
  function closeModal() { modal.classList.remove('open'); $('settingsBtn').focus(); }
  $('jsonClose').addEventListener('click', closeJsonViewer);
  jsonModal.addEventListener('click', function (e) { if (e.target === jsonModal) closeJsonViewer(); });
  $('settingsBtn').addEventListener('click', openModal);
  $('closeBtn').addEventListener('click', closeModal);
  modal.addEventListener('click', function (e) { if (e.target === modal) closeModal(); });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (jsonModal.classList.contains('open')) closeJsonViewer();
    else if (modal.classList.contains('open')) closeModal();
  });
  $('darkSwitch').addEventListener('change', function (e) { setTheme(e.target.checked); });
  function setLang(v) { lang = v === 'ru' ? 'ru' : 'en'; store('lang', lang); applyLang(); renderStorageRows(); }
  $('langSelect').addEventListener('change', function (e) { setLang(e.target.value); });
  $('welcomeLang').addEventListener('change', function (e) { setLang(e.target.value); });
  $('welcomeDark').addEventListener('change', function (e) { setTheme(e.target.checked); });
  $('startBtn').addEventListener('click', closeWelcome);
  $('searchLangSelect').addEventListener('change', function (e) { searchLang = e.target.value; store('searchLang', searchLang); cancelSuggest(); });
  $('hourlySwitch').addEventListener('change', function (e) { showHourly = e.target.checked; store('showHourly', showHourly ? '1' : '0'); render(); });
  $('historySwitch').addEventListener('change', function (e) {
    showHistory = e.target.checked;
    store('showHistory', showHistory ? '1' : '0');
    ensureHistory();
    render();
  });
  function ensureHistory() {
    var s = state;
    if (!showHistory || !s || s.history || s.lat == null) return;
    withTimeout(fetchHistory(s.lat, s.lon), 10000).then(function (h) {
      if (state !== s) return;
      s.history = h;
      store('lastWeatherData', JSON.stringify(s));
      render();
    }).catch(function () {});
  }
  function refresh() {
    var s = state;
    run(function () {
      return fetchAll(s.lat, s.lon).then(function (r) {
        return Object.assign({}, s, { data: r.data, air: r.air, history: r.history || s.history, stale: r.stale, ts: r.stale ? dataTs(r.data) : Date.now() });
      });
    }, { silent: true });
  }
  buildUnitSelects();
  buildSwatches();
  applyTheme(isThemeManual() ? load('theme') === 'dark' : systemDark());
  (function () {
    if (!window.matchMedia) return;
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    var onChange = function (e) { if (!isThemeManual()) applyTheme(e.matches); };
    if (mq.addEventListener) mq.addEventListener('change', onChange);
    else if (mq.addListener) mq.addListener(onChange);
  })();
  $('hourlySwitch').checked = showHourly;
  $('historySwitch').checked = showHistory;
  $('searchLangSelect').value = searchLang;
  applyLang();
  renderStorageRows();
  if (!load('onboarded')) openWelcome();
  var savedCity = load('lastCity');
  var type = load('lastSearchType');
  var savedPlace = loadJson('lastPlace');
  var loc = loadJson('lastLocation');
  var cached = loadJson('lastWeatherData');
  if (savedCity) $('city').value = savedCity;
  if (type === 'coords' && loc && isFinite(loc.lat) && isFinite(loc.lon)) { $('lat').value = loc.lat; $('lon').value = loc.lon; setMode('coords'); }
  if (cached && cached.data && cached.data.current && cached.data.daily && cached.lat != null) {
    state = cached;
    render();
    ensureHistory();
    refresh();
  } else if (type === 'place' && savedPlace && isFinite(savedPlace.lat) && isFinite(savedPlace.lon)) {
    loadPlace(savedPlace);
  } else if ((type === 'geo' || type === 'coords') && loc && isFinite(loc.lat) && isFinite(loc.lon)) {
    loadCoords(type, function () { return Promise.resolve({ latitude: loc.lat, longitude: loc.lon }); });
  } else if (savedCity) {
    searchCity(savedCity);
  }
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('./sw.js').catch(function () {}); });
  }
})();
</script>
</body>
</html>
