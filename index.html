<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="favicon.ico">
<title>Weather</title>
<meta name="theme-color" content="#1976D2">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<script>
  (function () {
    try {
      var th = localStorage.getItem('theme');
      var dark = th === 'dark' || (th !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) { document.body.classList.add('dark-theme'); document.documentElement.classList.add('dark-theme'); }
    } catch (e) {}
  })();
</script>
<div class="container">
  <header class="top">
    <h1><span class="material-icons">cloud</span><span data-i18n="title"></span></h1>
    <div class="top-actions">
      <button id="refreshBtn" class="icon-btn" data-i18n-aria="refresh" title="Refresh"><span class="material-icons">refresh</span></button>
      <button id="settingsBtn" class="icon-btn" data-i18n-aria="settings"><span class="material-icons">settings</span></button>
    </div>
  </header>
  <div class="card toolbar">
    <div class="tabs" role="tablist">
      <button class="tab active" data-mode="name" role="tab" aria-selected="true" data-i18n="tab_name"></button>
      <button class="tab" data-mode="coords" role="tab" aria-selected="false" data-i18n="tab_coords"></button>
    </div>
    <div class="field mode-panel" id="nameBox">
      <input id="city" type="text" placeholder=" " autocomplete="off" role="combobox" aria-autocomplete="list" aria-controls="suggest" aria-expanded="false">
      <label for="city" data-i18n="city"></label>
      <ul id="suggest" class="suggest" role="listbox" hidden></ul>
    </div>
    <div class="coords mode-panel" id="coordsBox" hidden>
      <div class="field"><input id="lat" type="text" inputmode="decimal" placeholder=" " autocomplete="off"><label for="lat" data-i18n="lat"></label></div>
      <div class="field"><input id="lon" type="text" inputmode="decimal" placeholder=" " autocomplete="off"><label for="lon" data-i18n="lon"></label></div>
    </div>
    <button id="search" class="btn btn-filled"><span class="material-icons">search</span><span data-i18n="search"></span></button>
    <button id="locate" class="btn btn-outlined"><span class="material-icons">my_location</span><span data-i18n="locate"></span></button>
  </div>
  <div id="error" class="error" role="alert"><span class="material-icons">error_outline</span><span id="errorText"></span></div>
  <div id="loader" class="loader">
    <svg class="spinner" viewBox="0 0 50 50"><circle cx="25" cy="25" r="20"></circle></svg>
  </div>
  <div id="results" class="results">
    <div class="grid fade">
      <div class="card now">
        <div class="stale" id="staleBadge" hidden><span class="material-icons">history</span><span data-i18n="stale"></span></div>
        <h2 data-i18n="now"></h2>
        <div class="place-row">
          <div class="city" id="place"></div>
          <button id="placeBtn" class="icon-btn small" aria-expanded="false" data-i18n-aria="place_info"><span class="material-icons">info_outline</span></button>
        </div>
        <div id="placeInfo" class="collapse"><div class="inner"><div class="info-grid" id="placeGrid"></div></div></div>
        <div class="now-main">
          <div class="now-icon"><span class="material-icons" id="nowIcon"></span></div>
          <div class="now-temp" id="nowTemp"></div>
        </div>
        <div class="desc" id="nowDesc"></div>
        <div class="muted" id="nowFeels"></div>
        <div class="muted updated" id="updated" hidden></div>
      </div>
      <div class="card">
        <h2 data-i18n="forecast"></h2>
        <div id="forecast"></div>
      </div>
    </div>
    <div class="card fade" id="hourlyCard">
      <h2 data-i18n="hourly"></h2>
      <div class="hourly" id="hourly"></div>
    </div>
    <section class="fade" id="tilesSection">
      <div class="tiles-header">
        <h2 class="section-title" data-i18n="details"></h2>
        <div class="tiles-controls">
          <select id="profileSelect" class="profile-select" aria-label="Profile"></select>
          <button id="renameProfileBtn" class="icon-btn small" data-i18n-aria="rename" hidden><span class="material-icons">edit</span></button>
          <button id="deleteProfileBtn" class="icon-btn small" data-i18n-aria="delete" hidden><span class="material-icons">delete</span></button>
          <button id="editTilesBtn" class="icon-btn small" data-i18n-aria="edit_layout"><span class="material-icons">dashboard_customize</span></button>
        </div>
      </div>
      <div class="tile-grid" id="tiles"></div>
      <div id="editToolbar" class="edit-toolbar" hidden>
        <button id="addTileBtn" class="btn btn-filled"><span class="material-icons">add</span><span data-i18n="add_tile"></span></button>
        <button id="doneEditBtn" class="btn btn-outlined"><span class="material-icons">check</span><span data-i18n="done"></span></button>
      </div>
    </section>
    <div class="card fade" id="histCard" hidden>
      <h2 data-i18n="history"></h2>
      <div class="hist" id="hist"></div>
      <div class="hist-legend"><span id="histFrom"></span><span id="histTo"></span></div>
      <div class="hist-sum" id="histSum"></div>
    </div>
  </div>
</div>
<div id="modal" class="backdrop">
  <div class="card dialog" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <h2 id="settingsTitle" data-i18n="settings"></h2>
    <div class="row">
      <span data-i18n="dark"></span>
      <label class="switch"><input id="darkSwitch" type="checkbox"><span class="track"></span><span class="thumb"></span></label>
    </div>
    <div class="row">
      <label for="langSelect" data-i18n="language"></label>
      <select id="langSelect"><option value="en">English</option><option value="ru">Русский</option></select>
    </div>
    <div class="row">
      <label for="searchLangSelect" data-i18n="search_lang"></label>
      <select id="searchLangSelect">
        <option value="en">English (en)</option><option value="ru">Русский (ru)</option><option value="de">Deutsch (de)</option>
        <option value="fr">Français (fr)</option><option value="es">Español (es)</option><option value="it">Italiano (it)</option>
        <option value="pt">Português (pt)</option><option value="tr">Türkçe (tr)</option><option value="zh">中文 (zh)</option><option value="ja">日本語 (ja)</option>
      </select>
    </div>
    <div class="row"><span data-i18n="show_hourly"></span><label class="switch"><input id="hourlySwitch" type="checkbox"><span class="track"></span><span class="thumb"></span></label></div>
    <div class="row"><span data-i18n="show_history"></span><label class="switch"><input id="historySwitch" type="checkbox"><span class="track"></span><span class="thumb"></span></label></div>
    <div class="row">
      <label for="refreshSelect" data-i18n="refresh_interval"></label>
      <select id="refreshSelect">
        <option value="0">Off</option>
        <option value="10">10 min</option>
        <option value="15">15 min</option>
        <option value="30">30 min</option>
        <option value="60">60 min</option>
        <option value="120">120 min</option>
      </select>
    </div>
    <div class="sec-title" data-i18n="units_title"></div>
    <div id="unitRows"></div>
    <div class="sec-title" data-i18n="accent"></div>
    <div class="swatches" id="swatches" role="radiogroup" data-i18n-aria="accent"></div>
    <details class="advanced" id="advancedDetails">
      <summary data-i18n="advanced"></summary>
      <div class="advanced-content">
        <div class="advanced-warning"><span class="material-icons" aria-hidden="true">warning</span><span data-i18n="advanced_warning"></span></div>
        <div id="storageStatus" class="storage-status" role="status" aria-live="polite"></div>
        <div id="storageRows"></div>
      </div>
    </details>
    <div class="actions"><button id="closeBtn" class="btn btn-outlined" data-i18n="close"></button></div>
  </div>
</div>
<div id="jsonModal" class="backdrop json-backdrop">
  <div class="card dialog json-dialog" role="dialog" aria-modal="true" aria-labelledby="jsonTitle">
    <h2 id="jsonTitle" data-i18n="json_title"></h2>
    <pre id="jsonContent" class="json-content"></pre>
    <div class="actions"><button id="jsonClose" class="btn btn-outlined" data-i18n="close"></button></div>
  </div>
</div>
<div id="addTileModal" class="backdrop">
  <div class="card dialog add-tile-dialog" role="dialog" aria-modal="true" aria-labelledby="addTileTitle">
    <h2 id="addTileTitle" data-i18n="add_tile_title"></h2>
    <div id="addTileGrid" class="add-tile-grid"></div>
    <div class="actions"><button id="addTileClose" class="btn btn-outlined" data-i18n="close"></button></div>
  </div>
</div>
<div id="welcome" class="welcome" role="dialog" aria-modal="true" aria-labelledby="welcomeTitle" hidden>
  <div class="card welcome-card">
    <span class="material-icons logo" aria-hidden="true">cloud</span>
    <h2 id="welcomeTitle" data-i18n="welcome_title"></h2>
    <p data-i18n="welcome_text"></p>
    <div class="row">
      <span data-i18n="dark"></span>
      <label class="switch"><input id="welcomeDark" type="checkbox"><span class="track"></span><span class="thumb"></span></label>
    </div>
    <div class="row">
      <label for="welcomeLang" data-i18n="language"></label>
      <select id="welcomeLang"><option value="en">English</option><option value="ru">Русский</option></select>
    </div>
    <div id="welcomeUnitRows"></div>
    <div class="actions"><button id="startBtn" class="btn btn-filled" data-i18n="get_started"></button></div>
  </div>
</div>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
